<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINERLA :: SHELL</title>
<meta name="description" content="sinerla.github.io">
<style>
  :root {
    --mono: ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", Consolas, monospace;
    --ink: #7dfcff;
    --pink: #ff4fd8;
    --pink-soft: #ff85e6;
    --black: #05060a;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--mono);
    color: var(--ink);
    background: var(--black);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    text-shadow: 0 0 6px rgba(125, 252, 255, 0.35);
  }

  .term-output {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    font-size: 14px;
    line-height: 1.6;
  }

  .term-line { margin: 0 0 4px; white-space: pre-wrap; word-break: break-word; }
  .term-line:last-child { margin-bottom: 0; }
  .term-line.heading { color: var(--pink); font-weight: 700; text-shadow: 0 0 8px rgba(255, 79, 216, 0.5); }
  .term-line.banner { color: var(--pink); font-weight: 700; letter-spacing: 0.05em; text-shadow: 0 0 8px rgba(255, 79, 216, 0.5); }
  .term-line.dim { color: #4f8f93; text-shadow: none; }
  .term-line.echo { color: var(--pink-soft); }
  .term-line.err { color: #ff6a6a; }

  .term-output a { color: #fff59d; text-decoration: underline; text-shadow: 0 0 6px rgba(255, 245, 157, 0.4); }
  .term-output a:hover { color: #fff; }
  .term-output a:focus-visible { outline: 1px dotted var(--ink); }

  .term-input-row {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px 16px;
    border-top: 1px dashed rgba(125, 252, 255, 0.2);
  }

  .prompt-label { color: var(--pink); white-space: nowrap; }

  .term-input-row input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    caret-color: var(--pink);
  }
</style>
</head>
<body>

<div class="term-output" id="output" aria-live="polite"></div>
<div class="term-input-row">
  <label class="prompt-label" for="cmd">guest@sinerla:~$</label>
  <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command input">
</div>

<script>
(function () {
  var output = document.getElementById('output');
  var input = document.getElementById('cmd');

  function printRaw(html, cls) {
    var div = document.createElement('div');
    div.className = 'term-line' + (cls ? ' ' + cls : '');
    div.innerHTML = html;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  }

  function printText(text, cls) {
    var div = document.createElement('div');
    div.className = 'term-line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  }

  var commands = {
    help: function () {
      printRaw('AVAILABLE COMMANDS', 'heading');
      printText('  /about      who runs this thing');
      printText('  /projects   things that have been built');
      printText('  /links      outside lines');
      printText('  /sysinfo    system information');
      printText('  /email      get in touch');
      printText('  /clear      clear the screen');
      printText('  /help       show this list');
    },
    about: function () {
      printRaw('ABOUT SYSOP', 'heading');
      printText('Software and web development. Days spent in PHP, servers and things');
      printText('that were supposed to work yesterday. Nights spent breaking them');
      printText('differently.');
      printText('');
      printText('Handle       sinerla');
      printText('Location     Finland');
      printText('Working on   WHMCS modules, WordPress plugins, small Node apps');
      printText('Also runs    A VPS that has never once been left alone');
    },
    projects: function () {
      printRaw('PROJECTS', 'heading');
      printRaw('[01] <a href="https://sinerla.fi">sinerla.fi</a> &mdash; portfolio, with a desktop of its own');
      printRaw('[02] <a href="https://github.com/sinerla">github.com/sinerla</a> &mdash; source, experiments, repos that peaked at commit three');
    },
    links: function () {
      printRaw('OUTSIDE LINES', 'heading');
      printRaw('[G] <a href="https://github.com/sinerla">github.com/sinerla</a> &mdash; code');
      printRaw('[W] <a href="https://sinerla.fi">sinerla.fi</a> &mdash; the real site');
    },
    sysinfo: function () {
      printRaw('SYSTEM INFO', 'heading');
      printText('Host         GitHub Pages');
      printText('Software     Hand-written HTML/CSS/JS, no framework, no build step');
      printText('Shell        sinerla shell v1.0');
      printText('Status       Under construction, as is tradition');
    },
    email: function () {
      printRaw('Opening mail client &hellip;', 'dim');
      printRaw('<a href="mailto:lauri@sinerla.fi">lauri@sinerla.fi</a>');
      window.setTimeout(function () {
        window.location.href = 'mailto:lauri@sinerla.fi';
      }, 200);
    },
    contact: function () { commands.email(); },
    clear: function () {
      output.innerHTML = '';
    },
    sudo: function () {
      printText('User guest is not in the sudoers file.', 'err');
      printText('This incident will be reported.', 'err');
      printText('(it will not actually be reported)', 'dim');
    },
    coffee: function () {
      printRaw('&#9749;  brewing&hellip;');
      printText('418 I\'M A TEAPOT', 'err');
      printText('coffee\'s on the sysop, come back later');
    }
  };

  function runCommand(raw) {
    var trimmed = raw.trim();
    if (!trimmed) return;
    printText('guest@sinerla:~$ ' + raw, 'echo');
    var name = trimmed.replace(/^\//, '').toLowerCase();
    if (commands[name]) {
      commands[name]();
    } else {
      printText('command not found: ' + trimmed, 'err');
      printText('type /help for a list of commands', 'dim');
    }
  }

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var val = input.value;
      input.value = '';
      runCommand(val);
    }
  });

  document.body.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    input.focus();
  });

  printText('░▒▓▓▒░  S I N E R L A  ░▒▓▓▒░', 'banner');
  printText('Type /help to see what this machine can do.');
  printText('');
  input.focus();
})();
</script>
</body>
</html>
